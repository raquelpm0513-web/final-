<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1131" width="100%" height="100%" style="background-color: #ffffff;">
  <defs>
    <!-- Stamp style -->
    <filter id="stamp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .title-ing { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 32px; fill: #222222; letter-spacing: -0.5px; }
    .title-tec { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 32px; fill: #D6002A; letter-spacing: -0.5px; }
    .legal-intro { font-family: 'Times New Roman', Times, serif; font-size: 14.5px; fill: #222222; text-anchor: middle; line-height: 1.5; }
    .cert-heading { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 26px; fill: #111111; letter-spacing: 2px; text-anchor: middle; }
    .cert-body { font-family: 'Times New Roman', Times, serif; font-size: 15px; fill: #222222; line-height: 1.6; }
    .cert-date { font-family: 'Times New Roman', Times, serif; font-size: 14.5px; fill: #222222; text-anchor: middle; }
    .signer-name { font-family: 'Times New Roman', Times, serif; font-size: 14.5px; fill: #222222; text-anchor: middle; }
    .stamp-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #1E3A8A; font-weight: bold; }
    .footer-links { font-family: 'Arial', sans-serif; font-size: 11px; fill: #222222; text-anchor: end; }
  </style>

  <!-- Background page -->
  <rect width="800" height="1131" fill="#ffffff"/>

  <!-- Ingertec Logo Top Right -->
  <g transform="translate(600, 50)">
    <text x="0" y="32" class="title-ing">inger<tspan class="title-tec">tec</tspan></text>
  </g>

  <!-- Legal Intro Paragraph (Lines 1-3) -->
  <text x="400" y="240" class="legal-intro">
    RAFAEL MONTES SOLER, con D.N.I 30.495.312-A, en calidad de representante de la empresa
  </text>
  <text x="400" y="262" class="legal-intro">
    GRUPO INGERTEC, S.L.U., domiciliada en Córdoba, en la Avenida San José De Calasanz nº 21 – 14.012
  </text>
  <text x="400" y="284" class="legal-intro">
    con C.I.F. núm. B- 84.534.965.
  </text>

  <!-- CERTIFICA: Heading -->
  <text x="400" y="380" class="cert-heading">CERTIFICA:</text>

  <!-- Certification Statement -->
  <text x="80" y="445" class="cert-body">
    <tspan x="80" dy="0">Que la empresa a la que represento ha sido contratada por </tspan>
    <tspan font-weight="bold">FIMECORP INTERNATIONAL</tspan>
    <tspan> con C.I.F.</tspan>
    <tspan x="80" dy="24" font-weight="bold">B45671187</tspan>
    <tspan> para el diseño e implantación de un Sistema de Gestión de Seguridad de la Información</tspan>
    <tspan x="80" dy="24">según el </tspan>
    <tspan font-weight="bold">ESQUEMA NACIONAL DE SEGURIDAD RD 311/2022 nivel alto y de ISO 9001</tspan>
    <tspan>.</tspan>
  </text>

  <!-- Validity Period -->
  <text x="400" y="580" class="cert-body" text-anchor="middle">
    El presente certificado tendrá validez hasta el 25 de octubre de 2026.
  </text>

  <!-- Formal Closing -->
  <text x="400" y="660" class="cert-date">
    Y para que surta los efectos oportunos ante quien corresponda, lo firmo en
  </text>
  <text x="400" y="720" class="cert-date">
    Córdoba, a 26 de agosto de 2026.
  </text>

  <!-- Stamp (Ingertec Seal) on Left -->
  <g transform="translate(140, 800)">
    <text x="50" y="20" class="stamp-text" font-size="16" fill="#1d4ed8" font-family="'Montserrat', sans-serif">inger<tspan fill="#b91c1c">tec</tspan></text>
    <text x="50" y="34" class="stamp-text" fill="#374151" font-size="9">B84534965</text>
    <text x="50" y="46" class="stamp-text" fill="#4b5563" font-size="8.5">Av. San José de Calasanz, 21</text>
    <text x="50" y="57" class="stamp-text" fill="#4b5563" font-size="8.5">14012 Córdoba</text>
  </g>

  <!-- Authentic Signature Graphic (Rafael Montes Soler) -->
  <g transform="translate(330, 770)" stroke="#1e3a8a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capital R / A swoops -->
    <path d="M20,65 Q35,10 50,45 Q65,80 90,40 Q110,10 130,55" />
    <path d="M45,45 Q70,40 120,42" />
    <path d="M85,30 Q100,5 110,65 Q115,20 135,35 Q145,55 170,40" />
    <!-- Flourish underline loop -->
    <path d="M30,55 Q70,85 140,75 Q175,70 160,50 Q145,30 110,48" />
  </g>

  <!-- Signer Text -->
  <text x="400" y="870" class="signer-name">
    <tspan x="400" dy="0" font-weight="bold">Rafael Montes Soler</tspan>
    <tspan x="400" dy="18">GRUPO INGERTEC</tspan>
  </text>

  <!-- Footer Contact Info Bottom Right -->
  <g transform="translate(720, 1000)">
    <text x="0" y="0" class="footer-links" fill="#1e3a8a" text-decoration="underline">compliance@ingertec.com</text>
    <text x="0" y="18" class="footer-links" fill="#1e3a8a" text-decoration="underline">http://ingertec.com/compliance</text>
    <text x="0" y="36" class="footer-links" fill="#333333" font-weight="bold">900 897 931</text>
  </g>
</svg>
