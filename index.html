        /* Unificación Tipográfica Global - Fimecorp (Montserrat) */
        :root {
            --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            --font-montserrat: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body, #root, button, input, select, textarea, h1, h2, h3, h4, h5, h6, p, span, a, div, li, label {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        code, kbd, samp, pre, .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace !important;
        }

        #root *:not(#hero-atom-watermark):not(#hero-atom-watermark *) { opacity: 1; }
        #hero-atom-watermark {
            opacity: 0.28 !important;
            filter: blur(0.5px) grayscale(10%) brightness(1.45) contrast(1.05) !important;
            pointer-events: none !important;
            user-select: none !important;
        }
        #hero-atom-watermark img {
            filter: none !important;
        }
        /* Modo estándar / autónomo: con cabecera interna visible */
        #hero-corporate {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            padding-top: 130px !important;
            padding-bottom: 50px !important;

        @media (min-width: 768px) {
            #hero-corporate { padding-top: 150px !important; padding-bottom: 70px !important; }
        }
        @media (min-width: 1024px) {
            #hero-corporate { padding-top: 160px !important; padding-bottom: 80px !important; }
        }

        /* En WordPress (fimecorp-portal.php) se oculta la cabecera interna
           si se detecta la cabecera externa para evitar duplicados. */

        body.hide-internal-header #hero-corporate {

    <div id="root"></div>
    <script>
      (function() {
        try {
          if (window.parent && window.parent !== window) {
            if (window.parent.document && window.parent.document.getElementById('fimecorp-header')) {
              document.body.classList.add('hide-internal-header');
            }
          }
          if (new URLSearchParams(window.location.search).get('wp') === '1') {
            document.body.classList.add('hide-internal-header');
          }
        } catch (e) {}

        window.addEventListener('message', function(e) {
          try {
            if (e.data && (e.data.action === 'navigate' || e.data.page === 'fabricantes')) {
              window.location.hash = 'fabricantes'; try { window.dispatchEvent(new Event('hashchange')); } catch(e){}
            }
          } catch (err) {}
        });
      })();
