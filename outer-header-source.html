<!-- ============================================================
  FIMECORP — Cabecera corporativa (HTML/CSS/JS puro)
  Conversión fiel del componente React Header.tsx + FimecorpLogo.tsx
  del proyecto nuevo, para poder pegarse en WordPress como bloque
  "HTML personalizado" (sin necesidad de build de React).

  CÓMO USARLO EN WORDPRESS:
  1. Sube /logo.png a la raíz del hosting (o cambia la ruta de abajo
     por la URL real, ej: https://fimecorp.com/wp-content/uploads/logo-fimecorp-nuevo.png)
  2. En el editor de WordPress, añade un bloque "HTML personalizado"
     (o "Custom HTML") al principio de la página/plantilla, y pega
     todo este archivo dentro.
  3. Si tu tema ya pone contenido justo debajo, añade el padding-top
     indicado más abajo al <body> o al primer contenedor de contenido,
     para que no quede tapado por la cabecera fija (position: fixed).
============================================================= -->
<style>
  #fimecorp-header, #fimecorp-header * { box-sizing: border-box; }
  #fimecorp-header {
    font-family: 'Montserrat', system-ui, sans-serif;
    position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
  }
  #fimecorp-header a { text-decoration: none; }
  #fimecorp-header button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* Barra superior de utilidad */
  #fh-top-bar {
    background: #001F3F;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 10px 0;
    display: none;
  }
  @media (min-width: 768px) { #fh-top-bar { display: block; } }
  #fh-top-bar .fh-inner {
    max-width: 1440px; margin: 0 auto; padding: 0 40px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #fh-top-bar .fh-left { display: flex; align-items: center; gap: 24px; }
  #fh-top-bar .fh-tagline {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: #e5e7eb;
  }
  #fh-top-bar .fh-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #00BFBF;
    animation: fh-pulse 2s infinite;
  }
  @keyframes fh-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #fh-top-bar .fh-sep { color: rgba(255,255,255,0.2); }
  #fh-top-bar .fh-support { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #e5e7eb; }
  #fh-top-bar .fh-right { display: flex; align-items: center; gap: 24px; font-size: 13px; }
  #fh-top-bar .fh-right a { color: #e5e7eb; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: color .2s; }
  #fh-top-bar .fh-right a:hover { color: #00BFBF; }
  .fh-icon { width: 14px; height: 14px; color: #00BFBF; flex-shrink: 0; }

  /* Barra principal */
  #fh-main-bar {
    background: rgba(0,64,128,0.95);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 20px 0;
    transition: all .3s;
  }
  #fh-main-bar.fh-scrolled {
    background: rgba(0,43,89,0.98);
    padding: 12px 0;
  }
  #fh-main-bar .fh-inner {
    max-width: 1440px; margin: 0 auto; padding: 0 40px;
    display: flex; justify-content: space-between; align-items: center;
  }

  #fh-logo-btn { position: relative; display: flex; align-items: center; padding: 6px; }
  #fh-logo-btn img { position: relative; z-index: 10; height: 64px; width: auto; max-width: 340px; object-fit: contain; display: block; }
  #fh-logo-btn .fh-halo1 {
    position: absolute; inset: 0; left: -16px; right: -16px;
    background: rgba(255,255,255,.95); border-radius: 999px; filter: blur(20px); z-index: 0; opacity: .9;
  }
  #fh-logo-btn .fh-halo2 {
    position: absolute; inset: -2px; background: rgba(255,255,255,.6); border-radius: 16px; filter: blur(8px); z-index: 0;
  }

  /* Navegación desktop */
  #fh-nav { display: none; align-items: center; gap: 6px; background: rgba(255,255,255,.05); padding: 6px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); }
  @media (min-width: 1024px) { #fh-nav { display: flex; } }
  #fh-nav button {
    padding: 10px 18px; border-radius: 12px; font-size: 15px; font-weight: 700;

  #fh-nav button.fh-active { color: #fff; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.15); }
  #fh-nav button.fh-active::after {
    content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);

  /* Drawer móvil */

  #fh-drawer .fh-drawer-nav button {

  #fh-drawer-footer { background: rgba(0,43,89,.8); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px; }
  #fh-drawer-footer .fh-lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; }
  #fh-drawer-footer .fh-lang-grid button { padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: rgba(255,255,255,.7); }
  #fh-drawer-footer .fh-lang-grid button.fh-lang-active { background: rgba(0,191,191,.2); color: #00BFBF; border-color: rgba(0,191,191,.4); }
  #fh-drawer-footer .fh-info-label { font-size: 12px; color: rgba(255,255,255,.4); }

  #fh-drawer-footer .fh-cta {
    width: 100%; margin-top: 16px; padding: 16px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 14px;
    color: #fff; background: linear-gradient(to right, #004080, #00BFBF);
  }

  /* Aviso de espaciado (solo referencia visual en preview) */
  #fh-spacer { height: 130px; }
  @media (max-width: 767px) { #fh-spacer { height: 100px; } }
</style>

<script data-no-optimize="1" data-cfasync="false">
(function () {
  var mainBar = document.getElementById('fh-main-bar');
  var topBar = document.getElementById('fh-top-bar');
  var spacer = document.getElementById('fh-spacer');

  // El alto real de la cabecera varía (según idioma, si cabe el texto en
  // una o dos líneas, etc.), así que en vez de un hueco fijo que a veces se
  // queda corto y tapa el principio del contenido, se mide el alto real de
  // la cabecera y se ajusta el hueco para que coincida siempre.
  function syncSpacerHeight() {
    var h = mainBar.getBoundingClientRect().height + (topBar ? topBar.getBoundingClientRect().height : 0);
    spacer.style.height = h + 'px';
  }
  syncSpacerHeight();
  window.addEventListener('resize', syncSpacerHeight);
  window.addEventListener('load', syncSpacerHeight);
  setTimeout(syncSpacerHeight, 300);
  setTimeout(syncSpacerHeight, 1000);
  var mainBar = document.getElementById('fh-main-bar');
  var burger = document.getElementById('fh-burger-btn');
  var drawer = document.getElementById('fh-drawer');
  var iconOpen = document.getElementById('fh-icon-open');
  var iconClose = document.getElementById('fh-icon-close');
  var langBtn = document.getElementById('fh-lang-btn');
  var langMenu = document.getElementById('fh-lang-menu');
  var langLabel = document.getElementById('fh-lang-label');

  function getIframe() { return document.getElementById('fimecorp-portal-iframe'); }

  // Efecto de scroll (siempre visible; solo cambia de estilo al hacer scroll)
  window.addEventListener('scroll', function () {
    if (window.scrollY > 40) mainBar.classList.add('fh-scrolled');
    else mainBar.classList.remove('fh-scrolled');
  });

  // Menú móvil
  burger.addEventListener('click', function () {
    var open = drawer.classList.toggle('fh-open');
    iconOpen.style.display = open ? 'none' : 'block';
    iconClose.style.display = open ? 'block' : 'none';
  });
  document.getElementById('fh-mail-btn').addEventListener('click', function () {
    goToPage('contacto');
  });

  // Selector de idioma: llama directamente a la función de traducción que
  // vive dentro del iframe (expuesta como window.fimecorpSetLanguage).
  langBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    langMenu.classList.toggle('fh-open');
  });
  document.addEventListener('click', function () { langMenu.classList.remove('fh-open'); });

  function setLang(lang) {
    document.querySelectorAll('[data-lang]').forEach(function (btn) {
      btn.classList.toggle('fh-lang-active', btn.getAttribute('data-lang') === lang);
    });
    langLabel.textContent = lang === 'es' ? '🇪🇸 ES' : '🇬🇧 EN';
    langMenu.classList.remove('fh-open');
    // Nota: la traducción automática se quitó (rompía el diseño y traducía
    // solo a medias). El selector se queda listo para conectarse el día que
    // haya contenido traducido de verdad.
  }
  document.querySelectorAll('[data-lang]').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      setLang(btn.getAttribute('data-lang'));
    });
  });

  // Navegación entre páginas: la app vive dentro del iframe y cambia de
  // "página" internamente (sin recargar ni cambiar de URL). Para navegar
  // desde esta cabecera externa, se simula un clic sobre el botón interno
  // de la app que tiene el mismo texto, y luego se sube hasta el iframe.
  var PAGE_LABELS = {
    'inicio': 'inicio',
    'sobre-nosotros': 'conócenos',
    'fabricantes': 'partners',
    'soluciones': 'especialidades',
    'unete-a-nosotros': 'únete a nosotros',
    'contacto': 'contacto'
  };

  function goToPage(pageId) {
    document.querySelectorAll('[data-page]').forEach(function (btn) {
      btn.classList.toggle('fh-active', btn.getAttribute('data-page') === pageId);
    });
    drawer.classList.remove('fh-open');
    iconOpen.style.display = 'block';
    iconClose.style.display = 'none';

    try {
      var doc = getIframe().contentWindow.document;
      var label = PAGE_LABELS[pageId];
      var candidates = doc.querySelectorAll('nav button, header button');
      for (var i = 0; i < candidates.length; i++) {
        var text = (candidates[i].textContent || '').trim().toLowerCase();
        if (text === label) { candidates[i].click(); break; }
      }
    } catch (e) {}

    var headerHeight = mainBar.getBoundingClientRect().height + document.getElementById('fh-top-bar').getBoundingClientRect().height;
    var top = window.scrollY + getIframe().getBoundingClientRect().top - headerHeight - 10;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }
  document.querySelectorAll('[data-page]').forEach(function (btn) {
    btn.addEventListener('click', function () { goToPage(btn.getAttribute('data-page')); });
  });
})();
</script>
