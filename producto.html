  <script>

    // GLOBAL TOAST NOTIFICATION
    window.showUploadToast = function(msg, type = 'success') {
      let toast = document.getElementById('upload-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'upload-toast';
        toast.className = 'fixed top-5 right-5 z-[9999] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-[-20px] opacity-0 pointer-events-none font-sans text-xs sm:text-sm font-bold';
        document.body.appendChild(toast);
      }
      const bg = type === 'success' ? 'bg-[#001F3F] text-white border border-blue-400/40' : (type === 'error' ? 'bg-rose-900 text-white border border-rose-500' : 'bg-slate-900 text-white border border-slate-700');
      toast.className = 'fixed top-5 right-5 z-[9999] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 font-sans text-xs sm:text-sm font-bold ' + bg;
      toast.innerHTML = (type === 'success' ? '<span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>' : '<span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span>') + '<span>' + msg + '</span>';
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.className += ' translate-y-[-20px] opacity-0 pointer-events-none';
      }, 3500);
    };

    // TRIGGER PHOTO UPLOAD
    window.triggerPhotoUpload = function(targetKey, productId, title) {
      let input = document.getElementById('global-photo-file-input');
      if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'global-photo-file-input';
        input.accept = 'image/png,image/jpeg,image/webp,image/svg+xml';
        input.style.display = 'none';
        document.body.appendChild(input);
      }
      input.value = '';
      input.onchange = async function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        showUploadToast('Subiendo fotografía...', 'info');
        const reader = new FileReader();
        reader.onload = async function(evt) {
          const base64 = evt.target.result;
          try {
            localStorage.setItem('user_photo_' + targetKey, base64);
          } catch(storageErr) {}
          try {
            const res = await fetch('/api/upload-image', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                targetKey: targetKey,
                targetProductId: productId,
                base64Data: base64,
                filename: file.name
              })
            });
            const data = await res.json();
            if (data.success) {
              showUploadToast('✅ Fotografía guardada correctamente', 'success');
              setTimeout(() => {
                if (window.renderProductView) window.renderProductView(productId);
              }, 200);
            } else {
              showUploadToast('Error al guardar: ' + (data.error || 'Error desconocido'), 'error');
            }
          } catch(err) {
            console.error('Upload error:', err);
            showUploadToast('✅ Fotografía cargada localmente', 'success');
            setTimeout(() => {
              if (window.renderProductView) window.renderProductView(productId);
            }, 200);
          }
        };
        reader.readAsDataURL(file);
      };
      input.click();
    };

    // REMOVE UPLOADED PHOTO
    window.removeUploadedPhoto = async function(targetKey, productId) {
      if (!confirm('¿Deseas quitar esta fotografía oficial?')) return;
      try {
        localStorage.removeItem('user_photo_' + targetKey);
      } catch(e) {}
      try {
        await fetch('/api/delete-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetKey, targetProductId: productId })
        });
      } catch(e) {}
      showUploadToast('Fotografía retirada', 'info');
      setTimeout(() => {
        if (window.renderProductView) window.renderProductView(productId);
      }, 200);
    };
  

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'system-ui', 'sans-serif'],

              blue: '#006DFF',
              teal: '#00A896',
              light: '#F8FAFC',
              accent: '#E6F0FA'
            }
          }
        }
      }
    }
  </script>

    // Function to ensure clean state
    function initRealPhotoUploader() {
      ['device', 'flatdeck', 'fulgrip', 'biomarc_restore_official_photo'].forEach(key => {
        try {
          localStorage.removeItem('real_photo_' + key);
          localStorage.removeItem(key);
        } catch(e) {}
      });
    }

    // Filter trocar series tables
    function setTrocarSeriesFilter(seriesId) {
      const cards = document.querySelectorAll('.trocar-series-card');
      cards.forEach(c => {
        if (seriesId === 'all' || c.getAttribute('data-series-id') === seriesId) {
          c.style.display = 'block';
        } else {
          c.style.display = 'none';
        }
      });
      const buttons = document.querySelectorAll('#trocar-tab-buttons button');
      buttons.forEach(b => {
        b.className = 'px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 hover:text-[#001F3F] text-xs font-bold cursor-pointer transition-all border border-slate-200';
      });
      const activeBtn = document.getElementById('tab-trocar-' + seriesId);
      if (activeBtn) {
        activeBtn.className = 'px-3.5 py-1.5 rounded-xl bg-[#001F3F] text-white text-xs font-bold shadow-xs cursor-pointer transition-all border border-transparent';
      }
    }

    // Function to handle returning to the portal's partners tab (closing current tab and focusing initial portal)
    function initPortalBackNavigation() {
      const backButtons = document.querySelectorAll('.portal-back-btn, [data-portal-back]');
      backButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const targetUrl = './index.html?page=fabricantes#fabricantes';

          // 1. If opened from another tab (the portal), focus it and ensure it shows the partners tab
          try {
            if (window.opener && !window.opener.closed) {
              try {
                window.opener.focus();
              } catch (focusErr) {}

              try {
                if (window.opener.location && window.opener.location.href) {
                  window.opener.location.hash = 'fabricantes';
                }
              } catch (locErr) {}

              try {
                window.opener.postMessage({ action: 'navigate', page: 'fabricantes', tab: 'fabricantes' }, '*');
              } catch (msgErr) {}
            }
          } catch (openerErr) {
            // Ignore potential cross-origin restrictions
          }

          // 2. Try notifying parent window if embedded in iframe
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ action: 'navigate', page: 'fabricantes', tab: 'fabricantes' }, '*');
            }
          } catch (err) {
            // Ignore cross-origin issues
          }

          // 3. Close this product tab so the user returns to the initial portal tab
          try {
            window.close();
          } catch (closeErr) {}

          // 4. Fallback: if browser prevents window.close() (e.g. tab opened directly by typing URL), navigate to portal
          setTimeout(function() {
            window.location.href = targetUrl;
          }, 150);
        });
      });
    }

    // Global tab filter handler for compatible reload types
    window.setReloadFilter = function(filterId) {
      const cards = document.querySelectorAll('.reload-type-card');
      const btns = document.querySelectorAll('#reloads-tab-buttons button');
      btns.forEach(b => {
        b.className = "px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-[#001F3F] cursor-pointer transition-all flex items-center gap-1.5";
      });
      const activeBtn = document.getElementById('tab-reloads-' + filterId);
      if (activeBtn) {
        activeBtn.className = "px-3.5 py-1.5 rounded-lg bg-white text-[#001F3F] font-bold shadow-xs cursor-pointer transition-all flex items-center gap-1.5";
      }
      cards.forEach(card => {
        if (filterId === 'all' || card.getAttribute('data-type-id') === filterId) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    };
  </script>
